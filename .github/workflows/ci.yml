name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20.x'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: backops
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Restore .NET dependencies
        run: dotnet restore BackOpsSimulator.sln

      - name: Build .NET solution
        run: dotnet build BackOpsSimulator.sln --no-restore -c Release

      - name: Run unit tests
        run: dotnet test tests/UnitTests/BackOps.UnitTests.csproj --no-build -c Release --logger "trx;LogFileName=unit-tests.trx" --collect:"XPlat Code Coverage"
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Database=backops;Username=postgres;Password=postgres
          ConnectionStrings__Redis: localhost:6379

      - name: Run integration tests
        run: dotnet test tests/IntegrationTests/BackOps.IntegrationTests.csproj --no-build -c Release --logger "trx;LogFileName=integration-tests.trx"
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Database=backops;Username=postgres;Password=postgres
          ConnectionStrings__Redis: localhost:6379

      - name: Run architecture tests
        run: dotnet test tests/ArchitectureTests/BackOps.ArchitectureTests.csproj --no-build -c Release --logger "trx;LogFileName=architecture-tests.trx"

      - name: Install frontend dependencies
        working-directory: ./apps/web
        run: npm ci

      - name: Build frontend
        working-directory: ./apps/web
        run: npm run build

      - name: Run frontend tests
        working-directory: ./apps/web
        run: npm test --if-present

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            tests/**/TestResults/*.trx
            apps/web/coverage

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/backops-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/backops-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'